<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><title>VR Varna Карти</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#1c1f24;--panel:#262a31;--ink:#e8eaf0;--mut:#9aa3b2;--grid:#2c3038;--acc:#ff2e88}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px -apple-system,Segoe UI,sans-serif}
#app{display:grid;grid-template-columns:230px 1fr 230px;height:100vh}
aside{background:var(--panel);padding:12px;overflow:auto}
h1{font-size:16px;margin:0 0 10px}h2{font-size:12px;text-transform:uppercase;color:var(--mut);margin:16px 0 6px;letter-spacing:.05em}
button,select,input{font:inherit;color:var(--ink);background:#323743;border:1px solid #444b58;border-radius:7px;padding:6px 8px}
button{cursor:pointer}button:hover{border-color:#6b7385}button.on{border-color:var(--acc);background:#3a2533}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pal button{display:flex;align-items:center;gap:6px;font-size:13px}
.sw{width:14px;height:14px;border-radius:3px;flex:none}
.row{display:flex;gap:6px;align-items:center;margin:5px 0}.row label{width:70px;color:var(--mut);font-size:12px}.row input{width:100%}
#wrap{position:relative;overflow:auto;display:flex;align-items:center;justify-content:center}
canvas{background:#202329;box-shadow:0 0 0 1px #444}
#stat{font-size:13px;line-height:1.5}.bad{color:#ff5a5a;font-weight:700}.ok{color:#4ade80;font-weight:700}
.hint{font-size:12px;color:var(--mut);line-height:1.45}
.kcat{width:100%;text-align:left;margin-top:4px;font-size:13px;background:#2c3139}
.krow{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:3px 5px;margin:2px 0;font-size:12px}
.krow img,.kico{width:32px;height:32px;flex:none;border-radius:4px;background:#555;object-fit:contain;display:inline-block}
.kname{overflow:hidden}.kname small{display:block;color:var(--mut);font-size:11px}.kmore{width:100%;font-size:12px;margin:2px 0 6px}
.warn{color:#ffd166;font-weight:700}
</style></head><body>
<div id="app">
<aside>
  <h1>VR Varna Карти</h1>
  <h2>Зала</h2>
  <select id="hall" style="width:100%">
    <option value="18.8x10.08">18,80 × 10,08 м (сегашната)</option>
    <option value="20x20">20 × 20 м</option>
    <option value="custom">Ръчно…</option>
  </select>
  <div class="row" id="customRow" style="display:none"><input id="hw" type="number" step="0.1" value="20"> × <input id="hh" type="number" step="0.1" value="20"></div>
  <div class="pal" id="pal"></div>
  <div id="syntyBox" style="display:none"><h2>Предмети от картата</h2><div class="pal" id="palSynty"></div></div>
  <h2>Каталог</h2>
  <input id="katQ" type="search" placeholder="Търси (име, вид)…" style="width:100%">
  <label class="hint" style="display:flex;gap:6px;align-items:center;margin:6px 0"><input id="katGore" type="checkbox" style="width:auto"> Покажи и обекти с кръв</label>
  <div id="kat"></div>
  <div id="katInfo" class="hint"></div>
  <div class="row" style="margin-top:10px"><button id="mirror" style="width:100%">⇋ Огледално: изкл.</button></div>
  <h2>Действия</h2>
  <div class="row"><button id="undo">↶ Отмени</button><button id="redo">↷ Повтори</button></div>
  <div class="row"><button id="save">💾 Запиши</button><button id="load">📂 Отвори</button></div>
  <div class="row"><button id="png" style="width:100%">🖼 Снимка отгоре (PNG)</button></div>
  <div class="row"><button id="clear" style="width:100%">Изчисти всичко</button></div>
  <div class="row" id="buildRow" style="display:none"><button id="build" style="width:100%;border-color:#4ade80">🏗 Построй в Unreal</button></div>
  <div id="buildStatus" class="hint"></div>
  <input type="file" id="file" accept=".json" hidden>
  <p class="hint">Избери вид и щракни в картата, за да го сложиш. Влачи, за да местиш. Влачи долния десен ъгъл, за да разтягаш. R завърта, Delete трие, Cmd+D копира, Cmd+Z отменя. Стрелките местят с 0,1 м.</p>
</aside>
<div id="wrap"><canvas id="cv"></canvas></div>
<aside>
  <h2>Проверка</h2>
  <div id="stat"></div>
  <h2>Избрано</h2>
  <div id="sel" class="hint">Нищо не е избрано.</div>
</aside>
</div>
<script>
const TYPES={
 // Стени (базовите типове на Бос от karti.html — type остава както е, преводът е в Unreal скрипта)
 wall:{n:'Стена',cat:'Стени',c:'#e0f4ef',w:3,d:0.2,h:2.4},
 halfwall:{n:'Половин стена',cat:'Стени',c:'#c9dcd6',w:2,d:0.2,h:1.1},
 column:{n:'Колона',cat:'Стени',c:'#b8c4cc',w:0.5,d:0.5,h:2.6},
 fence:{n:'Ограда',cat:'Стени',c:'#a07a52',w:3,d:0.1,h:1.8},
 netwall:{n:'Мрежа',cat:'Стени',c:'#8fa3a8',w:3,d:0.05,h:2.4},
 railing:{n:'Парапет',cat:'Стени',c:'#9ab0b8',w:2,d:0.1,h:1.0},
 // Сгради
 room:{n:'Помещение (M)',cat:'Сгради',c:'#d9e2ec',w:4,d:3,h:2.4,room:1},
 building:{n:'Сграда',cat:'Сгради',c:'#94a0b8',w:2,d:2.5,h:2.6},
 shed:{n:'Барака',cat:'Сгради',c:'#8a7a66',w:3,d:2.5,h:2.4},
 kiosk:{n:'Будка',cat:'Сгради',c:'#ffe680',w:1.2,d:1.2,h:1.1},
 tower:{n:'Кула',cat:'Сгради',c:'#a97de6',w:1,d:1.7,h:2.8,vis:1},
 // Прикрития
 crate:{n:'Сандък',cat:'Прикрития',c:'#ffef9a',w:0.8,d:0.8,h:1.0},
 container:{n:'Контейнер',cat:'Прикрития',c:'#eeaa50',w:2.4,d:1.4,h:1.8},
 pallets:{n:'Палети',cat:'Прикрития',c:'#c49a5c',w:1.2,d:1.0,h:1.0},
 sandbags:{n:'Торби с пясък',cat:'Прикрития',c:'#bfae84',w:1.6,d:0.6,h:0.9},
 barrel:{n:'Бъчва',cat:'Прикрития',c:'#5a8f5a',w:0.6,d:0.6,h:0.9,disc:1},
 tires:{n:'Гуми',cat:'Прикрития',c:'#3b3f45',w:0.8,d:0.8,h:0.6,disc:1},
 barrier:{n:'Бетонна бариера',cat:'Прикрития',c:'#a9abad',w:2,d:0.6,h:0.9},
 spool:{n:'Кабелна макара',cat:'Прикрития',c:'#9c7148',w:1.2,d:1.2,h:1.0,disc:1},
 // Превозни средства
 car:{n:'Кола',cat:'Превозни средства',c:'#c0504d',w:4.4,d:1.9,h:1.5},
 van:{n:'Бус',cat:'Превозни средства',c:'#d9b44a',w:5,d:2,h:2.2},
 truck:{n:'Камион',cat:'Превозни средства',c:'#6d8fb3',w:7,d:2.5,h:3,vis:1},
 // Декор
 lamppost:{n:'Улична лампа',cat:'Декор',c:'#e8e3a0',w:0.3,d:0.3,h:3,disc:1},
 sign:{n:'Знак',cat:'Декор',c:'#e06666',w:1,d:0.1,h:2},
 tree:{n:'Дърво',cat:'Декор',c:'#3f8f4f',w:1.5,d:1.5,h:4,disc:1},
 bench:{n:'Пейка',cat:'Декор',c:'#8c6a4a',w:1.6,d:0.5,h:0.45},
 table:{n:'Маса',cat:'Декор',c:'#9c7f60',w:1.2,d:0.8,h:0.75},
 trash:{n:'Кофа за боклук',cat:'Декор',c:'#4f6f5f',w:0.5,d:0.5,h:1.0,disc:1},
 pipe:{n:'Тръба',cat:'Декор',c:'#7f8c95',w:3,d:0.4,h:0.4},
 // Подове (само визуални, плоски)
 floor_concrete:{n:'Под: бетон',cat:'Подове',c:'#8e9296',w:4,d:4,h:0,flat:1},
 floor_asphalt:{n:'Под: асфалт',cat:'Подове',c:'#3e4249',w:4,d:4,h:0,flat:1},
 floor_grass:{n:'Под: трева',cat:'Подове',c:'#4f8a3c',w:4,d:4,h:0,flat:1},
 floor_wood:{n:'Под: дърво',cat:'Подове',c:'#9b7048',w:4,d:4,h:0,flat:1},
 floor_metal:{n:'Под: метал',cat:'Подове',c:'#9aa5ae',w:4,d:4,h:0,flat:1},
 floor_sand:{n:'Под: пясък',cat:'Подове',c:'#d8c48f',w:4,d:4,h:0,flat:1},
 marking:{n:'Линия на пода',cat:'Подове',c:'#f2f2f2',w:3,d:0.1,h:0,flat:1},
 floor:{n:'Под с материал',cat:'Подове',c:'#8a8f96',w:2,d:2,h:0,flat:1,mat:'beton'},
 // Светлини
 light_white:{n:'Лампа бяла',cat:'Светлини',c:'#fff7d6',w:0.4,d:0.4,h:2.8,light:1},
 light_red:{n:'Лампа червена',cat:'Светлини',c:'#ff5a5a',w:0.4,d:0.4,h:2.8,light:1},
 light_blue:{n:'Лампа синя',cat:'Светлини',c:'#5a8cff',w:0.4,d:0.4,h:2.8,light:1},
 light_neon:{n:'Неон',cat:'Светлини',c:'#ff4fd8',w:1.5,d:0.1,h:2.2,light:1},
 spotlight:{n:'Прожектор',cat:'Светлини',c:'#fffbe0',w:0.5,d:0.5,h:3,light:1},
 light:{n:'Светлина (цвят, сила)',cat:'Светлини',c:'#ffe680',w:0.4,d:0.4,h:0,flat:1,light:1},
 // Игра
 shield_r:{n:'Щит червен',cat:'Игра',c:'#e2302a',w:0.3,d:2,h:1.2},
 shield_b:{n:'Щит син',cat:'Игра',c:'#2a64e2',w:0.3,d:2,h:1.2},
 circle_r:{n:'Кръг червен',cat:'Игра',c:'#e2302a',w:2,d:2,h:0,round:1},
 circle_b:{n:'Кръг син',cat:'Игра',c:'#2a64e2',w:2,d:2,h:0,round:1},
 zone:{n:'Зона за точки',cat:'Игра',c:'#f5c542',w:3,d:3,h:0,flat:1,zone:1},
 flag:{n:'Знаме',cat:'Игра',c:'#ffffff',w:0.6,d:0.6,h:2,round:1},
 synty:{n:'Предмет',c:'#6f9a9e',w:1,d:1,h:1,hidden:1},
};
let syntyT=[]; // шаблони „Предмети от картата“ (уникални mesh)
const MIN_GAP=1.2, SNAP=0.1;
let map={version:1,hall:{w:18.8,h:10.08},items:[]};
let tool='building', sel=null, mirror=false, hist=[], fut=[];
const cv=document.getElementById('cv'), cx=cv.getContext('2d');
let S=40, OX=30, OY=30; // px per meter, offsets
const r2=v=>Math.round(v*100)/100, r1=v=>r2(Math.round(v/SNAP)*SNAP), fx=v=>(+v).toFixed(2).replace(/\.?0+$/,'');
const fx2=v=>(+v).toFixed(2).replace('.',',').replace(/,?0+$/,'').replace(/,$/,'');
const uid=()=>Math.random().toString(36).slice(2,9);
function push(){hist.push(JSON.stringify(map)); if(hist.length>200)hist.shift(); fut=[];}
function mirType(t){return t.endsWith('_r')?t.slice(0,-2)+'_b':t.endsWith('_b')?t.slice(0,-2)+'_r':t;}
// копие като НОВ предмет: synty пази mesh/label/ue.rot/ue.scale, без ue.loc/cx/cy
function fresh(it){const c=JSON.parse(JSON.stringify(it));delete c.pair;
  if(c.type==='synty'){const u=c.ue||{};c.ue={};if(u.rot)c.ue.rot=u.rot;if(u.scale)c.ue.scale=u.scale;}return c;}
function mirrorOf(it){const m=fresh(it);Object.assign(m,{id:uid(),type:mirType(it.type),x:r1(map.hall.w-it.x-it.w),pair:it.id});
  m.rot=(360-(it.rot||0))%360;if(it.type==='synty')m.mirrorX=!it.mirrorX;
  if(it.type==='room'||it.type==='wall'){if(it.doors)m.doors=mirOpenings(it,it.doors);if(it.windows)m.windows=mirOpenings(it,it.windows);}return m;}
function syncPair(it){ if(!it.pair)return; const p=map.items.find(o=>o.id===it.pair); if(!p)return;
  Object.assign(p,{w:it.w,d:it.d,h:it.h,y:it.y,x:r1(map.hall.w-it.x-it.w)});
  if(it.rot!=null||p.rot!=null)p.rot=(360-(it.rot||0))%360;
  for(const k of ['mat','kind','color','intensity','z','climb','label'])if(k in it&&it.type===p.type)p[k]=it[k];
  if(it.type==='room')Object.assign(p,{wall:it.wall,roof:it.roof,label:it.label,doors:mirOpenings(it,it.doors),windows:mirOpenings(it,it.windows)});
  else if(it.type==='wall'&&p.type==='wall'&&(it.doors||it.windows||p.doors||p.windows))Object.assign(p,{doors:mirOpenings(it,it.doors||[]),windows:mirOpenings(it,it.windows||[])}); }
// ── помещения (от karti.html на Бос): стени на парчета около вратите ──
// координатите на roomSegs/openingRect са в НЕЗАВЪРТЯНАТАТА рамка на стаята (както x,y,w,d); rot се прилага отгоре
const SIDES=['n','e','s','w'];
function sideLen(it,sd){return (sd==='n'||sd==='s')?it.w:it.d;}
// отделна стена (type wall): една „страна“ по дългата ос — 'n' ако w ≥ d (pos от левия край), иначе 'w' (pos от горния край)
const wallSide=it=>it.w>=it.d?'n':'w';
const opSide=(it,o)=>it.type==='room'?o.side:wallSide(it);
const hasOps=it=>it.type==='room'||(it.type==='wall'&&((it.doors||[]).length||(it.windows||[]).length));
function thickOf(it,sd){return it.type==='room'?(it.wall||0.2):(sd==='n'||sd==='s'?it.d:it.w);}
function roomSegs(it,withWindows){const out=[];
  for(const sd of (it.type==='room'?SIDES:[wallSide(it)])){const L=sideLen(it,sd),t=thickOf(it,sd);
    const cuts=(it.doors||[]).filter(o=>opSide(it,o)===sd).concat(withWindows?(it.windows||[]).filter(o=>opSide(it,o)===sd):[])
      .map(o=>[Math.max(0,o.pos),Math.min(L,o.pos+o.width)]).sort((a,b)=>a[0]-b[0]);
    let a=0;const parts=[];for(const [c0,c1] of cuts){if(c0>a)parts.push([a,c0]);a=Math.max(a,c1);}if(a<L)parts.push([a,L]);
    for(const [p0,p1] of parts){if(p1-p0<0.01)continue;
      if(sd==='n')out.push({x0:it.x+p0,x1:it.x+p1,y0:it.y,y1:it.y+t});
      if(sd==='s')out.push({x0:it.x+p0,x1:it.x+p1,y0:it.y+it.d-t,y1:it.y+it.d});
      if(sd==='w')out.push({x0:it.x,x1:it.x+t,y0:it.y+p0,y1:it.y+p1});
      if(sd==='e')out.push({x0:it.x+it.w-t,x1:it.x+it.w,y0:it.y+p0,y1:it.y+p1});}}
  return out;}
function openingRect(it,o){const sd=opSide(it,o),t=thickOf(it,sd);o={...o,side:sd};
  if(o.side==='n')return {x0:it.x+o.pos,x1:it.x+o.pos+o.width,y0:it.y,y1:it.y+t};
  if(o.side==='s')return {x0:it.x+o.pos,x1:it.x+o.pos+o.width,y0:it.y+it.d-t,y1:it.y+it.d};
  if(o.side==='w')return {x0:it.x,x1:it.x+t,y0:it.y+o.pos,y1:it.y+o.pos+o.width};
  return {x0:it.x+it.w-t,x1:it.x+it.w,y0:it.y+o.pos,y1:it.y+o.pos+o.width};}
const MIRSIDE={n:'n',s:'s',e:'w',w:'e'};
function mirOpenings(it,list){return (list||[]).map(o=>{const s0=opSide(it,o),c={...o};if(it.type==='room')c.side=MIRSIDE[s0];
  if(s0==='n'||s0==='s')c.pos=r2(sideLen(it,s0)-o.pos-o.width);return c;});}
// парче в незавъртяната рамка → „псевдо-предмет“ със същия rot (центърът му завъртян около центъра на стаята)
function partToItem(it,g){const w=g.x1-g.x0,d=g.y1-g.y0,c=toWorld(it,(g.x0+g.x1)/2-it.x-it.w/2,(g.y0+g.y1)/2-it.y-it.d/2);
  return {type:'wall',x:c.x-w/2,y:c.y-d/2,w,d,rot:it.rot||0,_of:it.id};}
// вратите/прозорците остават в стените след мащаб/дебелина
function fixOps(it){if(it.type!=='room'&&it.type!=='wall')return;const t=it.type==='room'?(it.wall||0.2):0;
  for(const k of ['doors','windows'])for(const o of (it[k]||[])){if(it.type==='room'&&!/^[nsew]$/.test(o.side))o.side='s';const L=sideLen(it,opSide(it,o)),mx=Math.max(0.1,L-2*t);
    o.width=r2(Math.max(0.1,Math.min(+o.width||(k==='doors'?1.2:1),mx)));o.pos=r2(Math.max(t,Math.min(L-t-o.width,+o.pos||0)));}}
function newRoom(x,y,w,d){return {id:uid(),type:'room',x,y,w,d,h:2.4,rot:0,wall:0.2,roof:false,label:'стая',doors:[{side:'s',pos:r1(Math.max(0.2,(w-1.2)/2)),width:1.2}],windows:[]};}
// клик върху стена на стая → {it, side, s (м по стената)}
function wallAt(p,only){const tol=Math.max(0.2,6/S);
  for(let i=map.items.length-1;i>=0;i--){const it=only||map.items[i];
    if(it.type==='room'){const l=toLocal(it,p),t=it.wall||0.2,lx=l.x+it.w/2,ly=l.y+it.d/2;
      const C=[['n',lx,ly],['s',lx,it.d-ly],['w',ly,lx],['e',ly,it.w-lx]];
      for(const [sd,s,u] of C){if(u>=-tol&&u<=t+tol&&s>=-tol&&s<=sideLen(it,sd)+tol)return {it,side:sd,s:Math.max(0,Math.min(sideLen(it,sd),s))};}}
    else if(it.type==='wall'){const l=toLocal(it,p),sd=wallSide(it),lx=l.x+it.w/2,ly=l.y+it.d/2,s=sd==='n'?lx:ly,u=sd==='n'?ly:lx,t=thickOf(it,sd);
      if(u>=-tol&&u<=t+tol&&s>=-tol&&s<=sideLen(it,sd)+tol)return {it,side:sd,s:Math.max(0,Math.min(sideLen(it,sd),s))};}
    if(only)break;}
  return null;}
function opAt(it,p){if(!it||!(it.type==='room'||it.type==='wall'))return null;const w=wallAt(p,it);if(!w)return null;const tol=Math.max(0.12,6/S);
  for(const k of ['doors','windows']){const L=it[k]||[];for(let i=0;i<L.length;i++){const o=L[i];if(opSide(it,o)!==w.side)continue;
    if(Math.abs(w.s-o.pos)<=tol)return {k,i,part:'a',side:w.side,s:w.s};if(Math.abs(w.s-o.pos-o.width)<=tol)return {k,i,part:'b',side:w.side,s:w.s};
    if(w.s>o.pos&&w.s<o.pos+o.width)return {k,i,part:'m',side:w.side,s:w.s};}}
  return null;}
function addOpening(kind,p){const w=wallAt(p);if(!w)return false;push();const it=w.it,k=kind==='door'?'doors':'windows',width=kind==='door'?1.2:1.0;
  it[k]=it[k]||[];const o={pos:r1(w.s-width/2),width};if(it.type==='room')o.side=w.side;if(kind==='window'){o.z0=1.0;o.z1=1.8;}it[k].push(o);fixOps(it);syncPair(it);setSel([it.id]);draw();return true;}
// ── layout ──
let lastHall='';
function resyncAll(){const hk=map.hall.w+'x'+map.hall.h;const changed=lastHall&&lastHall!==hk;lastHall=hk;
  if(changed)for(const it of map.items){if(/^(circle|shield)_/.test(it.type))it.y=r1(map.hall.h/2-it.d/2);}
  for(const it of map.items){if(it.pair&&it.x+it.w/2<map.hall.w/2)syncPair(it);if(it.type!=='synty')clamp(it);}}
function fit(){resyncAll();const wr=document.getElementById('wrap').getBoundingClientRect();
  S=Math.max(10,Math.min((wr.width-60)/map.hall.w,(wr.height-60)/map.hall.h))*(typeof zoom==='number'?zoom:1);

const KIND={synty:'high',building:'high',container:'mid',kiosk:'low',crate:'low',wall:'wall',shield_r:'red',shield_b:'blue',tower:'tower'};
function toUE(){const W=map.hall.w,H=map.hall.h,R=v=>Math.round(v*100)/100;const boxes=[],circles=[];let n=0;
  const rooms=[];
  const walls=[];
  for(const it of map.items){if(it.type==='wall'&&hasOps(it)){walls.push(JSON.parse(JSON.stringify(it)));let k=0;
      for(const g0 of roomSegs(it,true)){const g=rect(partToItem(it,g0));boxes.push([`wallop_${it.id}_${++k}`,R(g.x0-W/2),R(g.x1-W/2),R(H/2-g.y1),R(H/2-g.y0),'wall',R(it.h)]);}
      for(const o of it.windows||[]){const g=rect(partToItem(it,openingRect(it,o)));boxes.push([`wallop_${it.id}_${++k}`,R(g.x0-W/2),R(g.x1-W/2),R(H/2-g.y1),R(H/2-g.y0),'wall',1.0]);}continue;}
    if(it.type!=='room')continue;rooms.push(JSON.parse(JSON.stringify({id:it.id,x:it.x,y:it.y,w:it.w,d:it.d,h:it.h,rot:it.rot||0,wall:it.wall||0.2,roof:!!it.roof,label:it.label||'',doors:it.doors||[],windows:it.windows||[]})));
    let k=0;for(const g0 of roomSegs(it,true)){const g=rect(partToItem(it,g0));boxes.push([`room_${it.id}_${++k}`,R(g.x0-W/2),R(g.x1-W/2),R(H/2-g.y1),R(H/2-g.y0),'wall',R(it.h)]);}
    for(const o of it.windows||[]){const g=rect(partToItem(it,openingRect(it,o)));boxes.push([`room_${it.id}_${++k}`,R(g.x0-W/2),R(g.x1-W/2),R(H/2-g.y1),R(H/2-g.y0),'wall',1.0]);}}
  const extras=[];
  for(const it of map.items){if(TYPES[it.type].flat||TYPES[it.type].light){extras.push(JSON.parse(JSON.stringify(it)));continue;}if(it.type==='room'||(it.type==='wall'&&hasOps(it)))continue;const x0=R(it.x-W/2),x1=R(it.x+it.w-W/2),y0=R(H/2-(it.y+it.d)),y1=R(H/2-it.y);
    if(TYPES[it.type].round){circles.push({team:it.type==='circle_r'?1:2,x:R((x0+x1)/2),y:R((y0+y1)/2),r:R(it.w/2)});}
    else boxes.push([`${it.type}_${++n}`,x0,x1,y0,y1,KIND[it.type],R(it.h)]);}
  return {version:1,name:map.name||'Moya_karta',hall:{w:W,d:H},boxes,circles,rooms,walls,extras};}
function fromUE(o){const W=+o.hall.w,H=+(o.hall.d??o.hall.h);const items=[];
  const back={high:'building',mid:'container',wall:'wall',red:'shield_r',blue:'shield_b',tower:'tower'};
  for(const e of o.extras||[])if(TYPES[e.type])items.push({...JSON.parse(JSON.stringify(e)),id:uid()});
  for(const w of o.walls||[])items.push({...JSON.parse(JSON.stringify(w)),id:uid(),type:'wall'});
  for(const r of o.rooms||[])items.push({...JSON.parse(JSON.stringify(r)),id:uid(),type:'room',rot:r.rot||0,wall:r.wall||0.2,roof:!!r.roof,doors:r.doors||[],windows:r.windows||[]});
  for(const b of o.boxes||[]){const [nm,x0,x1,y0,y1,kind,h]=b;if(o.rooms&&String(nm).startsWith('room_'))continue;if(o.walls&&String(nm).startsWith('wallop_'))continue;let t=back[kind]||'building';if(kind==='low')t=h>1.05?'kiosk':'crate';
    items.push({id:uid(),type:t,x:r2(x0+W/2),y:r2(H/2-y1),w:r2(x1-x0),d:r2(y1-y0),h:+h});}
  for(const c of o.circles||[]){items.push({id:uid(),type:c.team===1?'circle_r':'circle_b',x:r2(c.x-c.r+W/2),y:r2(H/2-c.y-c.r),w:r2(2*c.r),d:r2(2*c.r),h:0});}
  // огледални двойки наново
  for(const a of items){if(a.pair)continue;const mx=r1(W-a.x-a.w);const m=items.find(b=>b!==a&&!b.pair&&b.type===mirType(a.type)&&Math.abs(b.x-mx)<0.15&&Math.abs(b.y-a.y)<0.15&&Math.abs(b.w-a.w)<0.15);
    if(m&&Math.abs(a.x+a.w/2-W/2)>0.3){a.pair=m.id;m.pair=a.id;}}
  return {version:1,name:o.name,hall:{w:W,h:H},items};}
