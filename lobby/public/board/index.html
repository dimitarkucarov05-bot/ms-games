<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard · MS Games</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23131411'/%3E%3Crect x='6.5' y='8.5' width='19' height='15' rx='2' fill='none' stroke='%23e9ece2' stroke-width='2'/%3E%3Ccircle cx='19.5' cy='16' r='3' fill='%23c8f03c'/%3E%3C/svg%3E">
<!--
  Класацията за екрана в залата (телевизор до касата или над входа). Отваря се от пулта: „Екран за залата",
  или направо на http://<компютъра>:47801/board. Само чете: нищо не може да се натисне.
  Сменя сама „днес" и „всички времена" (и игрите, ако са повече от една); докато върви игра, показва кой играе.
  Адрес с избор: /board/?game=backroom&period=day|week|month|all (тогава не сменя сама).
-->
<style>
@font-face { font-family: "Sofia Sans"; font-style: normal; font-weight: 1 1000; font-display: block;
  src: url(/fonts/sofia-sans-cyrillic-wght-normal.woff2) format("woff2");
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Sofia Sans"; font-style: normal; font-weight: 1 1000; font-display: block;
  src: url(/fonts/sofia-sans-latin-wght-normal.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Sofia Sans XC"; font-style: normal; font-weight: 1 1000; font-display: block;
  src: url(/fonts/sofia-sans-extra-condensed-cyrillic-wght-normal.woff2) format("woff2");
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Sofia Sans XC"; font-style: normal; font-weight: 1 1000; font-display: block;
  src: url(/fonts/sofia-sans-extra-condensed-latin-wght-normal.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

:root {
  color-scheme: dark;
  --bg: oklch(0.158 0.006 120);
  --rail: oklch(0.186 0.007 120);
  --line: oklch(0.265 0.008 120);
  --line-2: oklch(0.36 0.010 120);
  --text: oklch(0.95 0.008 112);
  --text-2: oklch(0.77 0.012 115);
  --text-3: oklch(0.63 0.012 115);
  --signal: oklch(0.9 0.19 122);
  --signal-ink: oklch(0.21 0.05 122);
  --bad: oklch(0.71 0.19 36);
  --u: min(1vw, 1.78vh);          /* една „стотна" от екрана 16:9: всичко се мери с нея, за да стои еднакво на всеки телевизор */
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text); overflow: hidden; cursor: none;
  font: 500 calc(var(--u) * 1.5) / 1.3 "Sofia Sans", "Segoe UI", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  display: grid; grid-template-rows: auto 1fr auto;
  padding: calc(var(--u) * 3) calc(var(--u) * 4) calc(var(--u) * 2.4);
  gap: calc(var(--u) * 2);
}
.label { font-size: calc(var(--u) * 1.15); font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-3); }
.num { font-family: "Sofia Sans XC", "Sofia Sans", sans-serif; font-weight: 800; line-height: 0.9; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: calc(var(--u) * 3); border-bottom: 1px solid var(--line); padding-bottom: calc(var(--u) * 1.6); }
.brand { display: flex; align-items: center; gap: calc(var(--u) * 0.8); }
.brand i { width: calc(var(--u) * 0.9); height: calc(var(--u) * 0.9); background: var(--signal); }
.brand b { font-family: "Sofia Sans XC", sans-serif; font-weight: 800; font-size: calc(var(--u) * 2.1); letter-spacing: 0.06em; }
h1 { font-family: "Sofia Sans XC", "Sofia Sans", sans-serif; font-weight: 800; font-size: calc(var(--u) * 6.2); line-height: 0.92; margin-top: calc(var(--u) * 0.9); }
.period { text-align: right; }
.period .num { font-size: calc(var(--u) * 3.4); color: var(--text); margin-top: calc(var(--u) * 0.4); }

main { min-height: 0; display: grid; grid-template-columns: 1fr; }
ol { list-style: none; padding: 0; display: grid; grid-auto-rows: 1fr; min-height: 0; transition: opacity 220ms ease-out; }
ol.out { opacity: 0; }
li {
  display: grid; grid-template-columns: calc(var(--u) * 7) 1fr auto calc(var(--u) * 14); align-items: center; gap: calc(var(--u) * 2);
  border-bottom: 1px solid var(--line); min-height: 0;
}
li .place { font-size: calc(var(--u) * 4.2); color: var(--text-3); text-align: right; }
li .team { font-size: calc(var(--u) * 2.4); line-height: 1.1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
li .who { font-size: calc(var(--u) * 1.15); line-height: 1.2; margin-top: calc(var(--u) * 0.2); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
li .stars { font-size: calc(var(--u) * 1.4); color: var(--text-2); white-space: nowrap; }
li .score { font-size: calc(var(--u) * 4.6); text-align: right; }
li:nth-child(-n+3) .place { color: var(--text); }
li:first-child .team { font-size: calc(var(--u) * 2.8); }
li:first-child .score { font-size: calc(var(--u) * 5.4); color: var(--signal); }
li.fresh { background: oklch(0.9 0.19 122 / 0.08); }
li.fresh .place::after { content: "new"; display: block; font: 700 calc(var(--u) * 0.95) "Sofia Sans", sans-serif; letter-spacing: 0.09em; text-transform: uppercase; color: var(--signal); margin-top: calc(var(--u) * 0.3); }
.empty { align-self: center; justify-self: center; text-align: center; color: var(--text-2); font-size: calc(var(--u) * 2.4); max-width: 34ch; }
.empty small { display: block; margin-top: calc(var(--u) * 0.8); font-size: calc(var(--u) * 1.5); color: var(--text-3); }

footer { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 3); min-height: calc(var(--u) * 5); }
.now { display: flex; align-items: baseline; gap: calc(var(--u) * 1.4); min-width: 0; }
.now .dot { width: calc(var(--u) * 0.9); height: calc(var(--u) * 0.9); border-radius: 50%; background: var(--signal); align-self: center; flex: none; }
.now.idle .dot { background: none; border: 2px solid var(--text-3); }
.now .what { font-size: calc(var(--u) * 2); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now .clock { font-size: calc(var(--u) * 3.6); }
.steps { display: flex; gap: calc(var(--u) * 0.5); }
.steps i { width: calc(var(--u) * 2.2); height: 3px; background: var(--line-2); }
.steps i.on { background: var(--text); }
.offline { color: var(--bad); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { ol { transition: none; } }
</style>
</head>
<body>
<header>
  <div>
    <div class="brand"><i></i><b>MS GAMES</b></div>
    <h1 id="game">Leaderboard</h1>
  </div>
  <div class="period"><div class="label">Leaderboard</div><div class="num" id="period">TODAY</div></div>
</header>
<main>
  <ol id="rows"></ol>
</main>
<footer>
  <div class="now idle" id="now"><span class="dot"></span><span class="what" id="nowText">Waiting for the next team</span><span class="num clock" id="nowClock"></span></div>
  <div class="steps" id="steps"></div>
</footer>
<script>
'use strict';
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const PERIOD_NAME = { day: 'TODAY', week: 'THIS WEEK', month: 'THIS MONTH', all: 'ALL TIME' };
const EMPTY_TEXT = { day: 'Nobody has played yet today', week: 'No games yet this week', month: 'No games yet this month', all: 'No games played yet' };
const ROWS = 7, TURN_MS = 18000;

let state = null, games = [], views = [], at = 0, version = -1, online = true, turnAt = 0, freshId = null, freshUntil = 0;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function get(path) {
  const r = await fetch(path, { cache: 'no-store' });
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}

/** Кои изгледи се редуват: за всяка игра „днес" и „всички времена"; с ?game или ?period стои на едно място. */
function buildViews() {
  const wantGame = qs.get('game'), wantPeriod = PERIOD_NAME[qs.get('period')] ? qs.get('period') : null;
  const list = games.filter(g => g.web && g.status !== 'soon' && (!wantGame || g.id === wantGame));
  const periods = wantPeriod ? [wantPeriod] : ['day', 'all'];
  const out = [];
  for (const g of list) for (const p of periods) out.push({ game: g, period: p });
  const same = out.length === views.length && out.every((v, i) => v.game.id === views[i].game.id && v.period === views[i].period);
  if (!same) { views = out; at = 0; }
  $('steps').innerHTML = views.length > 1 ? views.map((_, i) => `<i class="${i === at ? 'on' : ''}"></i>`).join('') : '';
}

function when(iso) {
  const d = new Date(iso), now = new Date();
  const hm = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  return d.toDateString() === now.toDateString() ? hm : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

async function show(fade) {
  const v = views[at];
  if (!v) { $('game').textContent = 'Leaderboard'; $('rows').innerHTML = '<div class="empty">No games installed</div>'; return; }
  let data = null;
  try { data = await get(`/api/scores?game=${encodeURIComponent(v.game.id)}&period=${v.period}&limit=${ROWS}`); } catch { return; }
  const paint = () => {
    $('game').textContent = v.game.name;
    $('period').textContent = PERIOD_NAME[v.period];
    const fresh = Date.now() < freshUntil ? freshId : null;
    $('rows').innerHTML = data.list.length ? data.list.map(e => `
      <li class="${e.id === fresh ? 'fresh' : ''}">
        <div class="num place">${e.rank}</div>
        <div><div class="team">${esc(e.team)}</div><div class="who">${e.size} ${e.size === 1 ? 'player' : 'players'} · ${esc(when(e.at))}${e.caught ? ' · caught' : ''}</div></div>
        <div class="stars">${e.stars} of 5</div>
        <div class="num score">${e.score}</div>
      </li>`).join('') : `<div class="empty">${EMPTY_TEXT[v.period]}<small>The first team goes straight to first place.</small></div>`;
    $('rows').style.gridTemplateRows = data.list.length ? `repeat(${ROWS}, 1fr)` : '1fr';
    for (const [i, el] of [...$('steps').children].entries()) el.className = i === at ? 'on' : '';
  };
  if (!fade) return paint();
  $('rows').classList.add('out');
  setTimeout(() => { paint(); $('rows').classList.remove('out'); }, 230);
}

function clock() {
  const s = state?.session, now = $('now');
  if (!online) { now.className = 'now idle'; $('nowText').innerHTML = '<span class="offline">No connection to MS Games</span>'; $('nowClock').textContent = ''; return; }
  if (s?.web && s.startedAt) {
    const left = Math.max(0, Math.round((Date.parse(s.startedAt) + (s.minutes || 0) * 60000 - Date.now()) / 1000));
    now.className = 'now';
    $('nowText').textContent = `Now playing: ${s.team || 'team'}`;
    $('nowClock').textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  } else {
    const r = state?.lastResult;
    now.className = 'now idle';
    $('nowText').textContent = r && !r.test ? `Last game: ${r.team}, ${r.score} points${r.rankDay ? `, place ${r.rankDay} today` : ''}` : 'Waiting for the next team';
    $('nowClock').textContent = '';
  }
}

async function poll() {
  try {
    state = await get('/api/state');
    online = true;
    games = state.games || [];
    buildViews();
    if (state.scoresVersion !== version) {
      const first = version < 0;
      version = state.scoresVersion;
      const r = state.lastResult;
      if (!first && r && !r.test) {            // нов резултат: показва се веднага изгледът „днес" на тази игра
        freshId = r.id; freshUntil = Date.now() + 60000;
        const i = views.findIndex(v => v.game.id === r.gameId && v.period === 'day');
        if (i >= 0) at = i;
        turnAt = Date.now();
      }
      await show(!first);
    }
  } catch { online = false; }
  clock();
}

setInterval(clock, 500);
setInterval(poll, 2000);
setInterval(() => {
  if (!views.length || Date.now() - turnAt < TURN_MS) return;
  turnAt = Date.now();
  if (views.length > 1) at = (at + 1) % views.length;
  show(views.length > 1);                      // и при един изглед: опреснява часовете и „ново"
}, 1000);
poll().then(() => { turnAt = Date.now(); if (version < 0) show(false); });
</script>
</body>
</html>
