    ? `ниво 0 (щанд, склад, град): ${s.lv[0].meshes} draw calls, ${s.lv[0].tris} триъгълника\nниво 1 (лаборатория): ${s.lv[1].meshes} draw calls, ${s.lv[1].tris} триъгълника · общо ${s.models} модела\nв този кадър${state.boxes ? ' (с рамките)' : ''}: ${r.calls} draw calls, ${r.triangles} триъгълника\n${state.hall.replace('x', ' × ')} · ${state.theme} · ${Math.round(fps)} кадъра/с · строеж ${window.__ms} ms`
    : `няма обстановка\n${window.__error || ''}`;
});
if (gallery) await buildGallery();
else { await rebuild(); setView(state.view); bar(); }
window.__ready = true;
</script></body></html>
