<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Задната стая: показания и заместители</title>
<style>
@font-face { font-family: "Sofia Sans"; font-weight: 1 1000; font-display: block; src: url(/fonts/sofia-sans-cyrillic-wght-normal.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Sofia Sans"; font-weight: 1 1000; font-display: block; src: url(/fonts/sofia-sans-latin-wght-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2212; }
:root {
  --bg: oklch(0.158 0.006 120); --rail: oklch(0.186 0.007 120); --surface: oklch(0.208 0.007 120);
  --line: oklch(0.265 0.008 120); --line-2: oklch(0.36 0.010 120);
  --text: oklch(0.95 0.008 112); --text-2: oklch(0.77 0.012 115); --text-3: oklch(0.63 0.012 115);
  --signal: oklch(0.9 0.19 122); --signal-ink: oklch(0.21 0.05 122); --bad: oklch(0.71 0.19 36);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.45 "Sofia Sans", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body { display: grid; grid-template-columns: minmax(0, 1fr) 430px; overflow: hidden; }
#stage { position: relative; min-width: 0; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas:active { cursor: grabbing; }
#tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; left: 0; top: 0; padding: 1px 6px; border-radius: 4px; background: oklch(0.158 0.006 120 / 0.78); color: var(--text-2);
  font: 550 12px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; white-space: nowrap; will-change: transform; }
.tag small { color: var(--text-3); font: inherit; }
#hud { position: absolute; left: 14px; bottom: 12px; color: var(--text-3); font-size: 13px; font-variant-numeric: tabular-nums; pointer-events: none; }
aside { background: var(--rail); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
header { padding: 16px 18px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
h1 { margin: 0; font-size: 18px; font-weight: 650; }
.lbl { font-size: 11.5px; font-weight: 650; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-3); margin-bottom: 5px; }
.row { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--text-2); font: 550 14px/1 "Sofia Sans", sans-serif; padding: 8px 12px; cursor: pointer; transition: background 140ms, color 140ms; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--signal); color: var(--signal-ink); font-weight: 700; }
label.chk { display: inline-flex; gap: 7px; align-items: center; color: var(--text-2); font-size: 14px; cursor: pointer; }
label.chk input { accent-color: oklch(0.9 0.19 122); width: 15px; height: 15px; margin: 0; }
p.note { margin: 0; color: var(--text-3); font-size: 13px; }
#scroll { overflow-y: auto; overflow-x: hidden; min-height: 0; flex: 1; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; background: var(--surface); text-align: left; font-size: 11px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); padding: 8px 8px; border-bottom: 1px solid var(--line); }
td { padding: 5px 8px; border-bottom: 1px solid var(--line); color: var(--text-2); }
td:not(.bad) { white-space: nowrap; }
td:first-child, th:first-child { padding-left: 18px; }
td:first-child { color: var(--text); font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
td.num, th.num { text-align: right; }
td.bad { color: var(--bad); font-weight: 650; }
td.src { color: var(--text-3); }
tr.ind td { background: oklch(0.208 0.007 120 / 0.55); }
@media (max-width: 1000px) { body { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="tags"></div>
  <div id="hud"></div>
</div>
<aside>
  <header>
    <h1>Показания и заместители</h1>
    <div class="row">
      <div><div class="lbl">Тема</div>
        <div class="seg" id="theme"><button data-v="night" aria-pressed="true">Нощ</button><button data-v="kids">Детска</button></div></div>
      <div><div class="lbl">Изглед</div>
        <div class="seg" id="views"><button data-v="near" aria-pressed="true">Отблизо</button><button data-v="two">От 2 м</button><button data-v="all">Всичко</button></div></div>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="run" checked> Състоянията се сменят сами</label>
      <label class="chk"><input type="checkbox" id="prov"> Пробен доставчик</label>
    </div>
    <p class="note">Влачене върти, колелцето приближава, десен бутон мести. „Пробен доставчик" подменя burner, customer и patty с чужди тела през <code>setAssetProvider</code>.</p>
  </header>
  <div id="scroll">
    <table>
      <thead><tr><th>kind</th><th>ш × в × д, м</th><th class="num">триъг.</th><th class="num">меша</th><th>от</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</aside>

<script type="module">
import * as THREE from '/play/vendor/three.module.js';
import * as models from './models.js';

const { KINDS, makeModel, setModelState, slotMarker, setAssetProvider, makeIndicator } = models;

const SPEC = {
  bun_bottom: [0.11, 0.03, 0.11], bun_top: [0.11, 0.05, 0.11], patty: [0.10, 0.02, 0.10], cheese: [0.10, 0.01, 0.10],
  lettuce: [0.11, 0.015, 0.11], plate: [0.22, 0.02, 0.22], fries: [0.09, 0.12, 0.06], cup: [0.07, 0.12, 0.07],
  ing_a: [0.07, 0.07, 0.07], ing_b: [0.07, 0.07, 0.07], ing_c: [0.07, 0.07, 0.07], ing_d: [0.07, 0.07, 0.07],
  beaker: [0.12, 0.16, 0.12], tray: [0.26, 0.03, 0.18], bag: [0.08, 0.10, 0.04],
  bin: [0.30, 0.85, 0.30], grill: [0.70, 0.85, 0.50], fryer: [0.45, 0.85, 0.50], drinks: [0.50, 1.40, 0.40],
  prep: [0.80, 0.85, 0.50], counter: [3.2, 0.85, 0.50], trash: [0.35, 0.60, 0.35], mixer: [0.60, 0.85, 0.50],
  burner: [0.50, 0.85, 0.50], packer: [0.70, 0.85, 0.50], hatch: [0.40, 0.40, 0.20], wall: [1.2, 2.2, 0.10],
  door: [1.20, 2.0, 0.08], shutter: [2.0, 1.2, 0.05], sign: [1.6, 0.5, 0.05], customer: [0.45, 1.70, 0.30],
};
const SIZED = { counter: 1, wall: 1, shutter: 1 };            // тези взимат w, h, d от opts
const HAS_IND = { burner: 1, packer: 1, mixer: 1, sign: 1, customer: 1 };
const ITEMS = KINDS.slice(0, 15);

// ---------- сцена ----------
const canvas = document.getElementById('view'), stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 60);
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 2.2);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(2, 5, 4);
scene.add(hemi, sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x1b1d1a }));
floor.position.y = -0.002;
const grid = new THREE.GridHelper(40, 40, 0x3a3d38, 0x2a2c28);
scene.add(floor, grid);
const world = new THREE.Group();
scene.add(world);

const BG = { night: { clear: 0x131411, floor: 0x1b1d1a, g1: 0x3a3d38, g2: 0x2a2c28, hemi: 2.2 }, kids: { clear: 0xd9d2e6, floor: 0xcfc7de, g1: 0xb3a8c9, g2: 0xc2b9d4, hemi: 2.6 } };

// ---------- състояние на страницата ----------
const S = { theme: 'night', run: true, provider: false, t: 0, live: [], tags: [] };
const tagsEl = document.getElementById('tags');

// Пробен доставчик: три пътя през куката (свой уред + false, свое тяло + true, null).
const fake = {
  make(T, kind, opts) {
    if (kind === 'burner') {                        // чуждо тяло + нашето показание, вързано за него
      const g = new T.Group();
      const body = new T.Mesh(new T.CylinderGeometry(0.2, 0.25, 0.85, 20).translate(0, 0.425, 0), new T.MeshLambertMaterial({ color: 0x3f6e8c }));
      const ind = makeIndicator(T, 'burner', { theme: opts.theme, z: -0.12 });
      g.add(body, ind);
      g.userData.indicator = ind;
      return g;
    }
    if (kind === 'customer') {
      const g = new T.Group();
      const mat = new T.MeshLambertMaterial({ color: 0xb8862b });
      const body = new T.Mesh(new T.CylinderGeometry(0.14, 0.2, 1.3, 14).translate(0, 0.65, 0), mat);
      const head = new T.Mesh(new T.SphereGeometry(0.15, 14, 10).translate(0, 1.5, 0), mat);
      const ind = makeIndicator(T, 'customer', { theme: opts.theme, y: 1.86 });
      g.add(body, head, ind);
      g.userData.indicator = ind;
      return g;
    }
    if (kind === 'patty') return new T.Mesh(new T.CylinderGeometry(0.05, 0.05, 0.02, 16).translate(0, 0.01, 0), new T.MeshLambertMaterial({ color: 0xd4626c }));
    return null;
  },
  setState(T, obj, kind, state) {
    if (kind !== 'patty') return false;             // показанията остават за models.js
    const c = Math.min(2, Math.max(0, state.cook || 0));
    obj.material.color.set(c < 1 ? 0xd4626c : 0x6c3a20).lerp(new T.Color(c < 1 ? 0x6c3a20 : 0x1b1715), c < 1 ? c : c - 1);
    return true;
  },
};

function place(kind, x, y, z, opts = {}, label = kind, sweep = null) {
  const o = makeModel(THREE, kind, { theme: S.theme, ...opts });
  o.position.set(x, y, z);
  world.add(o);
  const el = document.createElement('div');
  el.className = 'tag';
  el.textContent = label;
  tagsEl.appendChild(el);
  const e = { kind, obj: o, el, sweep, note: '' };
  S.tags.push(e);
  if (sweep) S.live.push(e);
  return e;
}

const RECIPES = [['ing_a', 'ing_c', 'ing_b'], ['ing_d', 'ing_a', 'ing_b', 'ing_c'], [], ['ing_b', 'ing_b', 'ing_d'], ['ing_c', 'ing_d', 'ing_a', 'ing_a']];
const ZONES = [[0.55, 0.78], [0.2, 0.42], [0.4, 0.6], [0.7, 0.92]];
const TEXTS = ['Обслужете клиентите', 'Рецепта: А В Б', 'Патрул! Скрийте се и не мърдайте, докато отмине', 'Затваряме', 'Нощна смяна: смеси, свари, опаковай и продай през прозорчето', ''];
const step = (t, period, n) => Math.floor(t / period) % n;

function build() {
  for (const e of S.tags) e.el.remove();
  world.clear();
  S.live = []; S.tags = [];

  // ред А: уредите върху тела с размера от т. 3
  place('mixer', -1.0, 0, 0, {}, 'mixer', t => { const r = RECIPES[step(t, 4, RECIPES.length)]; return [{ recipe: r }, r.length ? r.map(k => k.slice(4)).join(' ') : 'няма']; });
  place('burner', 0, 0, 0, {}, 'burner', t => {
    const ph = (t / 1.6) % 2, needle = ph < 1 ? ph : 2 - ph, zone = ZONES[step(t, 6.4, ZONES.length)], hits = step(t, 1.6, 4);
    return [{ needle, zone, hits }, 'игла ' + needle.toFixed(2) + ', зона ' + zone.join(' до ') + ', удари ' + hits];
  });
  place('packer', 1.0, 0, 0, {}, 'packer', t => { const p = step(t, 1.2, 6) * 0.25; const v = p > 1 ? 0 : p; return [{ progress: v }, 'progress ' + v.toFixed(2)]; });
  for (const x of [-1, 0, 1]) { const m = slotMarker(THREE); m.position.set(x, 0.85, 0); world.add(m); }
  const sm = slotMarker(THREE); sm.position.set(0.55, 0, 0.75); world.add(sm);
  const smTag = document.createElement('div'); smTag.className = 'tag'; smTag.textContent = 'slotMarker'; tagsEl.appendChild(smTag);
  S.tags.push({ kind: 'slot', obj: sm, el: smTag, note: '' });

  const back = makeModel(THREE, 'wall', { theme: S.theme, w: 3.4, h: 2.3, d: 0.1 });
  back.position.set(0, 0, -0.32);
  world.add(back);
  place('sign', 0, 1.62, -0.24, {}, 'sign', t => { const s = TEXTS[step(t, 3.5, TEXTS.length)]; return [{ text: s }, s ? '' : 'празно']; });

  place('customer', 2.3, 0, 0, {}, 'customer', t => {
    const c = t % 14, st = c < 1 ? 'in' : c < 11 ? 'wait' : c < 12.5 ? 'angry' : 'out', patience = st === 'wait' ? 1 - (c - 1) / 10 : st === 'in' ? 1 : 0;
    return [{ state: st, patience }, st + (st === 'wait' ? ' ' + patience.toFixed(2) : '')];
  });
  place('customer', 3.0, 0, 0, {}, 'customer', t => [{ state: 'wait', patience: 0.5 + 0.5 * Math.sin(t * 0.9) }, 'wait ' + (0.5 + 0.5 * Math.sin(t * 0.9)).toFixed(2)]);

  // ред Б: предметите върху тезгях
  place('counter', 0, 0, -2.4, { w: 3.2 }, 'counter');
  ITEMS.forEach((k, i) => place(k, -1.47 + i * 0.21, 0.85, -2.4, {}, k, k === 'patty' ? t => { const c = (t / 4) % 2; return [{ cook: c }, 'cook ' + c.toFixed(1)]; } : null));

  // ред В: останалите станции
  const open = t => { const v = 0.5 - 0.5 * Math.cos(t * 0.8); return [{ open: v }, 'open ' + v.toFixed(2)]; };
  let x = -4.3;
  for (const [k, w, opts, y, sw] of [['bin', 0.3], ['grill', 0.7], ['fryer', 0.45], ['drinks', 0.5], ['prep', 0.8], ['trash', 0.35], ['hatch', 0.4, {}, 0.9], ['door', 1.2, {}, 0, open], ['shutter', 2.0, { w: 2.0 }, 0.85, open], ['wall', 1.2, { w: 1.2 }]]) {
    place(k, x + w / 2, y || 0, -4.6, opts || {}, k, sw || null);
    x += w + 0.45;
  }
  fillTable();
}

// ---------- таблица: размер по т. 3 срещу измерено ----------
function count(o) {
  let tris = 0, meshes = 0;
  o.traverse(c => {
    if (!c.isMesh) return;
    meshes++;
    const g = c.geometry, n = g.index ? g.index.count : g.attributes.position ? g.attributes.position.count : 0;
    tris += Math.min(n, g.drawRange.count) / 3;
  });
  return [Math.round(tris), meshes];
}
const fmt = s => s.map(v => (+v.toFixed(3)).toString()).join(' × ');
const measure = o => { o.updateMatrixWorld(true); return new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3()).toArray(); };

function fillTable() {
  const rows = [];
  window.__rows = [];
  for (const k of KINDS) {
    const spec = SPEC[k], opts = { theme: S.theme, ...(SIZED[k] ? { w: spec[0], h: spec[1], d: spec[2] } : {}) };
    const o = makeModel(THREE, k, opts);
    if (k === 'mixer') setModelState(THREE, o, k, { recipe: ['ing_a', 'ing_b', 'ing_c', 'ing_d'] });
    const body = o.userData.placeholder ? o.children[0] : o;
    const got = measure(body), ok = !o.userData.placeholder || got.every((v, i) => Math.abs(v - spec[i]) < 0.0015);
    const [tris, meshes] = count(o);
    const src = o.userData.provided ? 'доставчик' : 'кутия';
    const size = ok ? fmt(got) : fmt(got) + ' (трябва ' + fmt(spec) + ')';
    rows.push(`<tr><td>${k}</td><td class="${ok ? '' : 'bad'}">${size}</td><td class="num">${tris}</td><td class="num">${meshes}</td><td class="src">${src}</td></tr>`);
    window.__rows.push({ kind: k, spec, got, ok, tris, meshes, src });
    if (HAS_IND[k]) {
      const ind = makeIndicator(THREE, k, opts);
      if (k === 'mixer') setModelState(THREE, ind, k, { recipe: ['ing_a', 'ing_b', 'ing_c', 'ing_d'] });
      const s = measure(ind), [t2, m2] = count(ind);
      rows.push(`<tr class="ind"><td>&nbsp;&nbsp;↳ уред</td><td>${fmt(s)}</td><td class="num">${t2}</td><td class="num">${m2}</td><td class="src">уред</td></tr>`);
      window.__rows.push({ kind: k + ':indicator', got: s, tris: t2, meshes: m2 });
    }
  }
  const m = slotMarker(THREE), [t3] = count(m);
  rows.push(`<tr class="ind"><td>slotMarker</td><td>${fmt(measure(m))}</td><td class="num">${t3}</td><td class="num">1</td><td class="src">знак</td></tr>`);
  document.getElementById('rows').innerHTML = rows.join('');
}

// ---------- камера: въртене, приближаване, местене ----------
const cam = { target: new THREE.Vector3(), az: 0, el: 0.2, dist: 3 };
const VIEWS = {
  near: { target: [0, 1.0, -0.1], az: 0.2, el: 0.24, dist: 2.3 },
  two: { target: [0, 1.0, -0.15], az: 0, el: 0.245, dist: 2.47 },      // очи на 1.6 м, на 2 м пред плота
  all: { target: [0, 0.7, -2.1], az: 0.35, el: 0.5, dist: 8.2 },
};
function setView(name) {
  const v = VIEWS[name];
  cam.target.fromArray(v.target); cam.az = v.az; cam.el = v.el; cam.dist = v.dist;
  for (const b of document.querySelectorAll('#views button')) b.setAttribute('aria-pressed', b.dataset.v === name);
}
function applyCam() {
  const ce = Math.cos(cam.el);
  camera.position.set(cam.target.x + cam.dist * ce * Math.sin(cam.az), cam.target.y + cam.dist * Math.sin(cam.el), cam.target.z + cam.dist * ce * Math.cos(cam.az));
  camera.lookAt(cam.target);
}
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, pan: e.button !== 0 || e.shiftKey }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.pan) {
    const k = cam.dist * 0.0016, right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0), up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
    cam.target.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
  } else {
    cam.az -= dx * 0.006;
    cam.el = Math.max(-0.2, Math.min(1.5, cam.el + dy * 0.006));
  }
});
const endDrag = () => { drag = null; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.dist = Math.max(0.3, Math.min(25, cam.dist * Math.exp(e.deltaY * 0.0012))); }, { passive: false });

// ---------- управление ----------
function setTheme(t) {
  S.theme = t;
  const b = BG[t];
  renderer.setClearColor(b.clear);
  floor.material.color.set(b.floor);
  grid.material.color?.set(b.g2);
  hemi.intensity = b.hemi;
  for (const el of document.querySelectorAll('#theme button')) el.setAttribute('aria-pressed', el.dataset.v === t);
  build();
}
document.getElementById('theme').addEventListener('click', e => { if (e.target.dataset.v) setTheme(e.target.dataset.v); });
document.getElementById('views').addEventListener('click', e => { if (e.target.dataset.v) setView(e.target.dataset.v); });
document.getElementById('run').addEventListener('change', e => { S.run = e.target.checked; });
document.getElementById('prov').addEventListener('change', e => { S.provider = e.target.checked; setAssetProvider(S.provider ? fake : null); build(); });

// ---------- кадър ----------
const hud = document.getElementById('hud'), v3 = new THREE.Vector3(), v4 = new THREE.Vector3(), ray = new THREE.Raycaster(), box = new THREE.Box3();
let tick = 0;
function hidden(e) {                                // има ли друго тяло между камерата и средата на обекта
  box.setFromObject(e.obj).getCenter(v4);
  const dir = v4.sub(camera.position), dist = dir.length();
  ray.set(camera.position, dir.divideScalar(dist));
  ray.far = dist;
  for (const hit of ray.intersectObject(world, true)) {
    let o = hit.object;
    while (o && o !== e.obj) o = o.parent;
    if (!o) return true;
  }
  return false;
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (S.run) S.t += dt;
  const w = stage.clientWidth, h = stage.clientHeight;
  if (canvas.width !== Math.round(w * renderer.getPixelRatio()) || canvas.height !== Math.round(h * renderer.getPixelRatio())) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  for (const e of S.live) {
    const [state, note] = e.sweep(S.t);
    setModelState(THREE, e.obj, e.kind, state, dt);
    e.note = note;
  }
  applyCam();
  renderer.render(scene, camera);
  const check = tick++ % 8 === 0;
  for (const e of S.tags) {
    e.obj.getWorldPosition(v3);
    v3.y -= 0.03;
    v3.project(camera);
    if (check) e.cover = hidden(e);
    const vis = !e.cover && v3.z < 1 && Math.abs(v3.x) < 1.05 && Math.abs(v3.y) < 1.05;
    e.el.style.display = vis ? '' : 'none';
    if (!vis) continue;
    if (e.note !== e.el.dataset.n) { e.el.dataset.n = e.note; e.el.innerHTML = e.kind === 'slot' ? 'slotMarker' : e.kind + (e.note ? ' <small>' + e.note + '</small>' : ''); }
    e.el.style.transform = `translate(${((v3.x + 1) / 2 * w).toFixed(1)}px, ${((1 - v3.y) / 2 * h + 4).toFixed(1)}px) translateX(-50%)`;
  }
  hud.textContent = `draw calls ${renderer.info.render.calls} · триъгълници ${renderer.info.render.triangles}`;
}

window.__preview = { THREE, models, scene, camera, renderer, world, cam, S, setView, setTheme, build };
setView('near');
setTheme('night');
requestAnimationFrame(frame);
</script>
