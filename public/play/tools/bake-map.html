<!doctype html>
<html lang="bg">
<meta charset="utf-8">
<title>Изпичане на карта</title>
<!--
  Работен инструмент (само на пробния сървър, tools/dev-server.mjs): взима готова карта на Synty
  (подредбата е извадена от Unity сцената с tools/synty/unity_scene.py), изрязва парчето около щанда,
  слива го в по една мрежа на текстура и го записва като един двоичен файл, който играта зарежда наведнъж.

    /play/tools/bake-map.html?map=shopping-plaza               оглед на цялата карта отгоре
    …&cx=10&cz=20&yaw=180&r=40                                  парче: център и посока на щанда (в координатите на Unity), радиус
    …&save=1                                                     записва public/play/assets/maps/<map>/city.bin + city.json
    …&hole=x0,x1,z0,z1;…                                         правоъгълници на игралната зона: предметите с център в тях не се взимат
    …&drop=име@x,z,радиус;…                                      маха предмет (или само част от модел) по име и място
    …&carve=x0,x1,z0,z1,y0,y1;…                                  изрязва кутия от всичко (кабината на асансьора)
    …&probe=x0,x1,z0,z1                                          какво от картата стои в този правоъгълник (window.__bake.probe)
    …&view=top&tx=0&tz=0&cy=2.95&zoom=0.026                      оглед отгоре, отрязан на височина cy (под покрива)
    …&lod=18,40,70                                               карти с природа: до 18 м от центъра LOD0, до 40 LOD1, до 70 LOD2, нататък LOD3
                                                                 (без този параметър навсякъде е най-евтиното ниво; дърветата тогава са картички)
    …&skip=Израз                                                 модели, които не се взимат изобщо (израз върху името, напр. skip=Sky|Cloud|Flowers)
    …&far=Израз@метри;…                                          модели, които се взимат само до това разстояние от центъра (far=Bush|Grass@25)
  Всички места са в координатите на щанда (метри, като в играта).
-->
<style>
  html, body { margin: 0; background: #14161a; color: #dfe6f2; font: 13px/1.4 ui-monospace, Consolas, monospace; }
  canvas { display: block; width: 100vw; height: 100vh; }
  pre { position: fixed; left: 8px; top: 8px; margin: 0; padding: 8px 10px; background: rgba(10, 12, 16, .8); max-width: 60vw; white-space: pre-wrap; }
</style>
<canvas id="c"></canvas>
<pre id="log">зареждам…</pre>
<script type="importmap">{ "imports": { "three": "/play/vendor/three.module.js", "three/addons/": "/play/vendor/addons/" } }</script>
<script type="module">
import * as THREE from 'three';
import { createAssets } from '/play/lib/assets.js';

const qs = new URLSearchParams(location.search);
const num = (k, d) => (qs.has(k) ? Number(qs.get(k)) : d);
const MAP = qs.get('map') || 'shopping-plaza';
const PLAZA = MAP === 'shopping-plaza';      // молът се пече точно както досега; новото по-долу важи за другите карти
const CX = num('cx', 0), CZ = num('cz', 0), YAW = num('yaw', 0) * Math.PI / 180, R = num('r', 0);
const SMALL = num('small', 0.7), NEAR = num('near', 16);
// правоъгълниците на игралната зона (x0,x1,z0,z1; няколко се делят с ;): каквото от картата стои в тях, се маха, за да застанат станциите на играта
const HOLES = (qs.get('hole') || '-3.4,3.4,-8,2.7').split(';').map(h => h.split(',').map(Number));
const BACK = num('back', -1e9);      // всичко по-назад от това (z в координатите на щанда) е зад глуха стена и не се взима        // дребните неща (под SMALL м) се взимат само до NEAR м
// отделни предмети от картата, които стоят в игралната зона, се махат по име и място: drop=име@x,z,радиус (няколко се делят с ;).
// Името е израз върху името на модела, мястото е центърът на предмета в координатите на щанда. Маха се и когато дупките го пазят.
const DROPS = (qs.get('drop') || '').split(';').filter(Boolean).map(d => {
  const [nm, at = ''] = d.split('@'), [x, z, r] = at.split(',').map(Number);
  return { re: new RegExp(nm), x: x || 0, z: z || 0, r: r || 0.5 };
});
// изрязване: carve=x0,x1,z0,z1,y0,y1 (няколко кутии се делят с ;) в координатите на щанда. Каквото от картата попада в кутията,
// се изрязва триъгълник по триъгълник (там стои нещо на играта, например кабината на асансьора); извън нея нищо не се пипа.
const CARVES = (qs.get('carve') || '').split(';').filter(Boolean).map(b => b.split(',').map(Number)).filter(b => b.length === 6 && b.every(Number.isFinite));
// probe=x0,x1,z0,z1: списък на взетите обекти, чиято точна кутия пресича този правоъгълник (в window.__bake.probe), за проверка какво стои в зоната
const PROBE = qs.has('probe') ? qs.get('probe').split(',').map(Number) : null;
const log = s => { document.getElementById('log').textContent = s; };
const say = []; const note = s => { say.push(s); log(say.join('\n')); };
window.__bake = { done: false, error: null };

const slugOf = s => s.split('/').pop().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const base = `/play/assets/maps/${MAP}/`;
try {
  const [layout, where] = await Promise.all([fetch(base + 'layout.json').then(r => r.json()), fetch(base + 'where.json').then(r => r.json())]);
  const assets = createAssets();
  const packs = [...new Set(Object.values(where).map(slugOf))];
  await Promise.all(packs.map(p => assets.loadPack(p).catch(e => note(`пакет ${p}: ${e.message}`))));

  // мястото на щанда: център (CX, CZ) и посока YAW в координатите на Unity. Картата се мести и върти така,
  // че щандът да е в началото и да гледа към +Z (както в играта). После огледало по X (Unity е лява система).
  const c = Math.cos(YAW), s = Math.sin(YAW);
  const toStand = new THREE.Matrix4().makeRotationY(-YAW).multiply(new THREE.Matrix4().makeTranslation(-CX, 0, -CZ));
  const mirror = new THREE.Matrix4().makeScale(-1, 1, 1);
  const need = new Map(), picked = [], pos = new THREE.Vector3(), dropped = [];

  // ── Модели от няколко части ──
  // В Unity всяка част (врата, стъкло, чекмедже) е отделен обект със свое място и свой материал и в layout.json идва на
  // отделен ред с името си. В glb частите са деца на основната мрежа, а при няколко витрини стъклото е слято в нея като
  // отделен материал. Тук всеки ред на част се свързва с основния ред на своето копие; после всеки ред рисува само своята
  // част, със своята матрица и своя материал. Така нищо не се рисува два пъти и стъклото си остава стъкло.
  const items = layout.items, modelOf = it => layout.models[it[0]].split('/')[1], partOf = it => (layout.parts ? layout.parts[it[13]] || '' : '');
  // Нива на детайл (LOD): в картите с природа всяко дърво, храст и трева идва на 2 до 4 реда (…_LOD0 … _LOD3), а в glb нивата са
  // отделни възли на един модел. Взима се само едно ниво на копие според разстоянието до центъра; последното ниво на боровете е картичка.
  const LODS = (qs.get('lod') || '').split(',').filter(Boolean).map(Number);
  const lodOf = it => { const mm = /_LOD(\d)$/i.exec(partOf(it)); return mm ? +mm[1] : -1; };
  const maxLod = new Map();
  if (!PLAZA) for (const it of items) { const l = lodOf(it); if (l >= 0) maxLod.set(it[0], Math.max(maxLod.get(it[0]) ?? 0, l)); }
  const lodWanted = (it, dist) => { const top = maxLod.get(it[0]) ?? 0; if (!LODS.length) return top; let l = 0; while (l < LODS.length && dist >= LODS[l]) l++; return Math.min(l, top); };
  const SKIP = qs.get('skip') ? new RegExp(qs.get('skip')) : null;
  const FAR = (qs.get('far') || '').split(';').filter(Boolean).map(f => { const [nm, dd] = f.split('@'); return { re: new RegExp(nm), d: Number(dd) || 0 }; });
  const M4 = it => new THREE.Matrix4().set(it[1], it[2], it[3], it[4], it[5], it[6], it[7], it[8], it[9], it[10], it[11], it[12], 0, 0, 0, 1);
  const keyOf = it => it[0] + '/' + it[13];
  // възлите с мрежа в един glb: име -> { root: името на най-горния възел с мрежа над него, prims: имената на материалите му подред }
  const glbCache = new Map();
  const glbNodes = (slug, name) => {
    const k = `${slug}/${name}`;
    if (!glbCache.has(k)) glbCache.set(k, fetch(`/play/assets/synty/${slug}/${name}.glb`).then(r => r.arrayBuffer()).then(buf => {
      const dv = new DataView(buf), js = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 20, dv.getUint32(12, true))));
      const nodes = js.nodes || [], up = new Map(), out = new Map();
      nodes.forEach((n, i) => (n.children || []).forEach(ch => up.set(ch, i)));
      nodes.forEach((n, i) => {
        if (n.mesh === undefined) return;
        let r = i;
        while (up.has(r) && nodes[up.get(r)].mesh !== undefined) r = up.get(r);
        out.set(n.name || '', { root: nodes[r].name || '', prims: js.meshes[n.mesh].primitives.map(p => js.materials?.[p.material]?.name || '') });
      });
      return out;
    }).catch(() => new Map()));
    return glbCache.get(k);
  };
  const multi = new Map();      // номер на модел -> възлите му, само за моделите с редове на части
  {
    const ask = new Set();
    for (const it of items) { const p = partOf(it); if (p && p !== modelOf(it)) ask.add(it[0]); }
    await Promise.all([...ask].map(async mi => {
      const key = layout.models[mi], pack = where[key];
      if (pack && assets.has(slugOf(pack), key.split('/')[1])) multi.set(mi, await glbNodes(slugOf(pack), key.split('/')[1]));
    }));
  }
  // част без свой възел (стъклото на SM_Bld_ShopFront_*): в glb е слята в основната мрежа и се познава по името на материала
  const mergedPrims = (g, name, part) => {
    const root = g.get(name);
    if (!root || root.prims.length < 2) return [];
    const words = (part.startsWith(name) ? part.slice(name.length) : part).split(/[^A-Za-z]+/).filter(w => w.length > 2).map(w => w.toLowerCase());
    return root.prims.map((mt, i) => (words.some(w => mt.toLowerCase().includes(w)) ? i : -1)).filter(i => i >= 0);
  };
  // вид на всеки ред: 0 рисува целия модел (както винаги), 1 основен ред на копие с части, 2 част със свой възел, 3 част, слята в основната мрежа
  const kind = new Uint8Array(items.length);
  items.forEach((it, n) => {
    const g = multi.get(it[0]), p = partOf(it);
    if (!g || !p) return;
    const node = g.get(p);
    if (node) kind[n] = node.root === p ? 1 : 2;
    else if (mergedPrims(g, modelOf(it), p).length) kind[n] = 3;
  });
  // кой е основният ред на всяка част. Редовете на едно копие са един до друг и в един и същ ред, затова разликата в номерата
  // (част минус основен) е една и съща за всички копия на модела: взима се най-честата, после по-редките за останалите.
  const owner = new Int32Array(items.length).fill(-1), claimed = new Map();
  {
    const WIN = 40, offs = new Map();
    items.forEach((it, n) => {
      if (kind[n] < 2) return;
      const cnt = offs.get(keyOf(it)) || offs.set(keyOf(it), new Map()).get(keyOf(it));
      for (let j = Math.max(0, n - WIN); j <= Math.min(items.length - 1, n + WIN); j++) if (kind[j] === 1 && items[j][0] === it[0]) cnt.set(n - j, (cnt.get(n - j) || 0) + 1);
    });
    const order = new Map([...offs].map(([k, cnt]) => [k, [...cnt].sort((a, b) => b[1] - a[1]).map(e => e[0])]));
    for (let k = 0, more = true; more; k++) {
      more = false;
      items.forEach((it, n) => {
        if (kind[n] < 2 || owner[n] >= 0) return;
        const lst = order.get(keyOf(it)) || [];
        if (k >= lst.length) return;
        more = true;
        const j = n - lst[k], had = claimed.get(j);
        if (j < 0 || j >= items.length || kind[j] !== 1 || items[j][0] !== it[0] || (had && had.has(partOf(it)))) return;
        owner[n] = j;
        (had || claimed.set(j, new Set()).get(j)).add(partOf(it));      // един основен ред взима всяка своя част само веднъж
      });
    }
  }
  // обичайното място на всяка част спрямо основния ѝ ред (в Unity оста ѝ е в нейния център или панта, в glb не е): най-честото в сцената
  const usual = new Map();
  {
    const rel = new Map();
    items.forEach((it, n) => {
      if (owner[n] < 0) return;
      const D = M4(items[owner[n]]).invert().multiply(M4(it)), e = D.elements;
      const k = [e[12], e[13], e[14]].map(v => Math.round(v * 500)).join(','), all = rel.get(keyOf(it)) || rel.set(keyOf(it), new Map()).get(keyOf(it));
      (all.get(k) || all.set(k, { n: 0, D }).get(k)).n++;
    });
    for (const [k, all] of rel) usual.set(k, [...all.values()].sort((a, b) => b.n - a.n)[0].D);
  }

  // къде е спрямо щанда (x надясно към отворената страна, z напред към тезгяха)
  const spot = it => { pos.set(it[4], it[8], it[12]).applyMatrix4(toStand); return [-pos.x, pos.z]; };
  const passes = (it, slug, name) => {
    if (!R || /Sky|Cloud/.test(name)) return true;
    const dx = it[4] - CX, dz = it[12] - CZ, dist = Math.hypot(dx, dz);
    const info = assets.info(slug, name), sc = Math.max(Math.hypot(it[1], it[5], it[9]), Math.hypot(it[2], it[6], it[10]), Math.hypot(it[3], it[7], it[11]));
    const size = (info ? Math.max(...info.size) : 1) * sc, [ax, az] = spot(it);
    if (dist > R && !(size > 12 && dist < R * 2.2)) return false;            // далечното: само големите сгради
    if (size < SMALL && dist > NEAR) return false;                           // дребното: само наблизо
    if (size < 2.2 && dist > R * 0.62) return false;
    const ground = /Floor|Sidewalk|Road|Ground_|Trim/.test(name);
    if (!ground && !/Wall|Pillar|Roof|Ceiling|Door|Glass/.test(name) && HOLES.some(H => ax > H[0] && ax < H[1] && az > H[2] && az < H[3])) return false;      // в игралната зона
    if (az < BACK - size / 2) return false;
    if (it[8] > 14 && dist < 30 && size < 6) return false;                  // дреболии по покривите наблизо
    return true;
  };
  for (let ix = 0; ix < items.length; ix++) {
    const it = items[ix], key = layout.models[it[0]], pack = where[key];
    if (!pack) continue;
    const slug = slugOf(pack), name = key.split('/')[1];
    if (!assets.has(slug, name)) continue;
    if (SKIP && SKIP.test(name)) continue;
    if (FAR.length) { const dd = Math.hypot(it[4] - CX, it[12] - CZ); if (FAR.some(f => dd > f.d && f.re.test(name))) continue; }
    if (!PLAZA) { const l = lodOf(it); if (l >= 0 && l !== lodWanted(it, Math.hypot(it[4] - CX, it[12] - CZ))) continue; }      // друго ниво на детайл на същото копие
    const head = owner[ix] >= 0 ? items[owner[ix]] : it;      // частите вървят с основния си ред: влиза цялото копие или нищо от него
    if (!passes(head, slug, name)) continue;
    const [ax, az] = spot(it), [hx, hz] = spot(head), part = partOf(it);
    const where3 = `(${ax.toFixed(2)}, ${it[8].toFixed(2)}, ${az.toFixed(2)})`;
    if (!/Sky|Cloud/.test(name) && DROPS.some(D => D.re.test(name) && Math.hypot(hx - D.x, hz - D.z) <= D.r)) {      // пречи в игралната зона
      dropped.push(`${ix} ${name}${part && part !== name ? ' [' + part + ']' : ''} ${where3}`);
      continue;
    }
    // drop може да сочи и само част от модела (по името на частта и мястото на целия предмет): останалото от предмета стои
    if (kind[ix] >= 2 && DROPS.some(D => D.re.test(part) && !D.re.test(name) && Math.hypot(hx - D.x, hz - D.z) <= D.r)) {
      dropped.push(`${owner[ix]} ${name}: само частта ${part} (${hx.toFixed(2)}, ${head[8].toFixed(2)}, ${hz.toFixed(2)})`);
      continue;
    }
    need.set(`${slug}/${name}`, [slug, name]);
    picked.push([slug, name, it, ix, ax, az]);
  }
  note(`обекти: ${picked.length} от ${layout.items.length}, модели: ${need.size}`);
  if (DROPS.length) { note(`махнати по име и място: ${dropped.length}`); for (const d of dropped) note('  ' + d); }
  window.__bake.dropped = dropped;
  window.__bake.picked = picked.map(p => p[3]);
  await assets.preload([...need.values()]);

  // материалите са тези от Unity: коя текстура (от пакета) и какъв цвят има всяка част на всеки модел
  const matCache = new Map();
  // другите карти: папката от Unity -> пакетът, в чиято tex/ са текстурите с имената от Unity (tools/synty/maps/<карта>)
  const PACK_OF = { PolygonApocalypse: 'apocalypse-pack', PolygonNatureBiomes: 'alpine-mountain-nature-biome', PNB_Core: 'alpine-mountain-nature-biome',
    PolygonMapsWoodlandApocalypse: 'woodland-apocalypse-map', PolygonGeneric: 'woodland-apocalypse-map' };
  const packSlug = pk => (PLAZA ? (pk === 'PolygonShops' ? 'shops-pack' : 'shopping-plaza-map') : PACK_OF[pk] || 'woodland-apocalypse-map');
  function materialFor(i) {
    if (matCache.has(i)) return matCache.get(i);
    const q = layout.mats?.[i];
    let mat = null;
    if (q) {
      const file = q.tex ? q.tex.replace(/\.tga$/i, '.png') : null, slug = packSlug(q.pack);
      const alpha = !!q.tex && /\.tga$/i.test(q.tex) || /transparent|alpha|ivy|wire/i.test(q.name);
      const unlit = (PLAZA ? /sky|emissive|screen|neon|glow/i : /sky|emissive|emission|screen|neon|glow/i).test(q.name) || /sky/i.test(q.tex || '');
      const src = file ? assets.material(slug, `tex/${file}`) : null;
      const info = { tex: file ? `${slug}/tex/${file}` : '', color: q.color || [1, 1, 1], glass: !!q.glass, alpha, unlit, name: q.name };
      mat = unlit ? new THREE.MeshBasicMaterial({ map: src?.map || null }) : new THREE.MeshLambertMaterial({ map: src?.map || null });
      mat.color.setRGB(info.color[0], info.color[1], info.color[2], THREE.SRGBColorSpace);
      if (info.glass) { mat.transparent = true; mat.opacity = Math.min(0.5, Math.max(0.22, (q.alpha ?? 0.4) * 0.6)); mat.depthWrite = false; info.opacity = mat.opacity; }
      if (alpha) { mat.alphaTest = 0.5; mat.side = THREE.DoubleSide; }
      mat.userData.info = info;
      // еднаквите материали (същата текстура, цвят и вид) стават един
      const key = JSON.stringify([info.tex, info.color, info.glass, info.alpha, info.unlit]);
      if (matCache.has(key)) mat = matCache.get(key); else matCache.set(key, mat);
    }
    matCache.set(i, mat);
    return mat;
  }
  const atlasMat = (slug, file) => { const src = assets.material(slug, `tex/${file}`), mt = new THREE.MeshLambertMaterial({ map: src.map }); mt.userData.info = { tex: `${slug}/tex/${file}`, color: [1, 1, 1], name: file }; return mt; };
  const shopsAtlas = PLAZA ? atlasMat('shops-pack', 'PolygonShops_Texture_01_A.png') : null, genericAtlas = PLAZA ? atlasMat('shopping-plaza-map', 'Generic_01_A.png') : null;
  const packAtlas = new Map();
  const atlasOf = async slug => { if (!packAtlas.has(slug)) { const pk = await assets.loadPack(slug); const mt = assets.material(slug, pk.defaultMap); mt.userData.info = { tex: pk.defaultMap ? `${slug}/${pk.defaultMap}` : '', color: [1, 1, 1], name: pk.defaultMap || slug }; packAtlas.set(slug, mt); } return packAtlas.get(slug); };
  if (!PLAZA) for (const p of packs) await atlasOf(p).catch(() => null);
  const list = [], m = new THREE.Matrix4(), probe = [], pbox = new THREE.Box3();
  let missing = 0;
  const stat = { own: 0, merged: 0, kept: 0, moved: [], lost: [] };      // части със свой възел, слети в основната мрежа, деца без свой ред, със свое място, неоткрити
  const nodeNameOf = me => me.userData?.name ?? me.parent?.userData?.name ?? '';      // мрежата на материал е дете на възела си и няма свое име
  for (const [slug, name, it, ix, ax, az] of picked) {
    const o = assets.getSync(slug, name);
    if (!o) { missing++; continue; }

  window.__bake.error = String(e && e.stack || e);
  note('ГРЕШКА: ' + window.__bake.error);
}
</script>
