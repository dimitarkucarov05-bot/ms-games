<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#150a1c">
<title>Скан на играч — MS Games</title>
<link rel="stylesheet" href="scan.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">MS Games</p>
      <h1>Скан на играч</h1>
    </div>
    <p class="pill" id="link" data-tone="" role="status"><span class="dot" aria-hidden="true"></span><span id="linkText">Връзка с LabCoin…</span></p>
  </header>

  <section aria-labelledby="hsH">
    <h2 id="hsH" class="label">Към коя каска</h2>
    <div class="chips" id="chips" role="radiogroup" aria-label="Каска"></div>
  </section>

  <section aria-labelledby="scH" class="scan">
    <h2 id="scH" class="label">Кодът на играча</h2>
    <button type="button" class="btn btn-main" id="cam">Сканирай QR кода</button>
    <div class="cam" id="camBox" hidden>
      <video id="video" playsinline muted></video>
      <div class="frame" aria-hidden="true"></div>
      <button type="button" class="btn btn-quiet" id="camStop">Спри камерата</button>
    </div>
    <p class="hint" id="camHint" hidden></p>
    <form class="manual" id="manual" autocomplete="off">
      <label for="code" class="sr">Код от 6 знака</label>
      <input id="code" name="code" type="text" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="60" placeholder="или въведи кода (6 знака)">
      <button type="submit" class="btn" id="go">Провери</button>
    </form>
    <p class="hint" id="mockHint" hidden></p>
  </section>

  <section id="result" aria-live="polite"></section>

  <section aria-labelledby="boundH">
    <h2 id="boundH" class="label">Вързани играчи</h2>
    <ul class="bound" id="bound"></ul>
    <p class="hint" id="boundEmpty">Още никой не е сканиран.</p>
    <button type="button" class="btn btn-quiet" id="releaseAll" hidden>Освободи всички</button>
  </section>

  <p class="hint foot" id="foot"></p>
</main>
<script src="scan.js" type="module"></script>
</body>
</html>
